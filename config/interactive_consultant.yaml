# Interactive Consultant Configuration for SWE-Agent
# Provides real-time consultant guidance + enforces search-before-edit + JSON summary at the end.

agent:
  type: default
  model: &worker_model
    name: openai/gpt-4o-mini
    api_key: $OPENAI_API_KEY
    per_instance_cost_limit: 2.0
    per_instance_call_limit: 100
    total_cost_limit: 1000.0
    temperature: 0.0
    delay: 0.0

  templates:
    system_template: |-
      You are a code migration assistant working on solving tasks. You have access to various tools and can interact with a computer environment.

      ⚠️ Rules:
      - Use `web_search_tool` ONCE at the start to research the migration requirements and unfamiliar libraries.
      - After initial research, proceed with implementation without additional web searches.
      - After you are confident the task is complete, output a JSON summary of all changes (schema below).
      - Consultant guidance (🧠) is authoritative. You must consider and integrate it.

      Final Step:
      - At the end, and only at the end, output the JSON summary. Do not output JSON mid-task.

    instance_template: |-
      <uploaded_files>
      {{working_dir}}
      </uploaded_files>
      I've uploaded a python code repository in the directory {{working_dir}}. Consider the following PR description:

      <pr_description>
      {{problem_statement}}
      </pr_description>

      **Your Task:**
      Implement the necessary changes to meet the requirements in the PR description. Make minimal, targeted changes only to non-test files.

      **Approach:**
      1. **Research Once**: Use `web_search_tool` ONCE at the start to research the migration requirements and unfamiliar libraries.
         Example:
         - `web_search_tool("How to migrate from argparse to click in Python?")`
      2. **Understand the Repository**: Explore the repo structure to understand how it is organized.
      3. **Implement Changes**: Modify only the files/functions relevant to the migration. Remove deprecated code instead of commenting it.
      4. **Verify**: Test your changes.
      5. **Finalize**: At the very end, summarize all changes in the JSON schema below.

      **JSON Schema (final output only):**
      ```json
      {
        "files": [
          {
            "path": "<file_path>",
            "code_changes": [
              {
                "line": "<line_number(s)>",
                "cardinality": "<one-to-one/one-to-many/etc.>",
                "source_program_elements": ["<source_element>"],
                "target_program_elements": ["<target_element>"],
                "properties": ["<properties>"],
                "source_apis": ["<source_api>"],
                "target_apis": ["<target_api>"]
              }
            ]
          }
        ]
      }
      ```

      **Valid values only:**
      - ProgramElement: import, exception, function call, attribute, decorator, function reference, type  
      - Cardinality: zero-to-one, one-to-zero, one-to-one, one-to-many, many-to-one, many-to-many, not applicable  
      - Property: element name change, argument addition, argument deletion, argument name change, argument transformation, async transformation, output transformation, parameter addition to decorated function

    next_step_template: |-
      OBSERVATION:
      {{observation}}

    next_step_no_output_template: |-
      Your command ran successfully and did not produce any output.

  # Hook configuration for interactive consultant
  hooks:
    - type: interactive_consultant
      consultant_model:
        name: openai/gpt-4o
        api_key: $OPENAI_API_KEY
        temperature: 0.2
        per_instance_cost_limit: 0.4
        per_instance_call_limit: 8
      force_intervention: true
      force_warmup_steps: 2
      force_include_repo_samples: 5
      intervention_threshold: 1
      max_interventions: 20
      working_dir: "{{working_dir}}"

  tools:
    execution_timeout: 300
    bundles:
      - path: tools/registry
      - path: tools/edit_anthropic
      - path: tools/search_web
      - path: tools/review_on_submit_m
    enable_bash_tool: true
    parse_function:
      type: function_calling
    registry_variables:
      USE_FILEMAP: "true"
      SUBMIT_REVIEW_MESSAGES:
        - |
          Thank you for your work on this task. The consultant system has been monitoring your progress and providing guidance as needed.

          Please submit your final solution.

  history_processors:
    - type: cache_control
      last_n_messages: 4

# Environment configuration
env:
  deployment:
    type: docker
    image: python:3.11
