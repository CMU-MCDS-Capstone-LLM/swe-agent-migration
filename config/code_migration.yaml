agent:
  type: default
  model: &worker_model
    name: openai/gpt-4o
    api_key: $OPENAI_API_KEY
    per_instance_cost_limit: 2.0
    per_instance_call_limit: 100
    total_cost_limit: 1000.0
    temperature: 0.0
    delay: 0.0

  templates:
    system_template: |-
      You are a code migration assistant. You have access to tools to analyze code, edit files, and run tests.

      Rules:
      - Use `exec_command <container_name> <command>` for all repository commands (tests, installs, etc.)
      - Do NOT modify test files or try to fix test failures
      - Output JSON summary at the end only

    instance_template: |-
      <uploaded_files>
      {{working_dir}}
      </uploaded_files>

      Repository: {{working_dir}}
      Task: {{problem_statement}}

      **Steps (execute in order):**

      1. **Use RepoGraph Tool First** (REQUIRED):
         - Run: `repograph_query {{working_dir}} <source_module>`
         - Example: `repograph_query {{working_dir}} slackclient`
         - This finds ALL files using the deprecated library

      2. **Run Tests Before Migration**:
         - Run: `exec_command <container_name> pytest -q --tb=short --disable-warnings`
         - Record baseline test results

      3. **Perform Migration**:
         - Modify source files based on repograph results
         - Update requirements.txt if needed (e.g., replace slackclient with slack-sdk)
         - Do NOT modify test files

      4. **Run Tests After Migration**:
         - Run: `exec_command <container_name> pytest -q --tb=short --disable-warnings`
         - Record post-migration test results

      5. **Output JSON Summary**:
         - Include all changes made
         - Include test results (before and after)

      **Important:**
      - Tests verify your work but failures are acceptable - do NOT fix tests
      - Focus on migrating source code only
      - Container name is in the problem statement

    next_step_template: |-
      OBSERVATION:
      {{observation}}

    next_step_no_output_template: |-
      Your command ran successfully and did not produce any output.
  tools:
    execution_timeout: 600 # Increased timeout for repograph queries (multilspy can take time)
    bundles:
      - path: tools/registry
      - path: tools/edit_anthropic
      - path: tools/review_on_submit_m
      - path: tools/docker_exec
      - path: tools/repograph
    enable_bash_tool: true
    parse_function:
      type: function_calling
    registry_variables:
      USE_FILEMAP: "true"
      SUBMIT_REVIEW_MESSAGES:
        - |
          Thank you for your work on this task.

          Please submit your final solution.

  history_processors:
    - type: cache_control
      last_n_messages: 2
